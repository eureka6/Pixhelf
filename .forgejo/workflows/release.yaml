name: Build and release

on:
  push:
    tags:
      - 'v*'
  pull_request:

jobs:
  build:
    runs-on: docker
    container:
      image: docker.io/library/node:22-bookworm
    steps:
      - name: Check out source
        uses: https://data.forgejo.org/actions/checkout@v6

      - name: Install Rust toolchain
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            pkg-config
          curl --proto '=https' --tlsv1.2 --silent --show-error --fail https://sh.rustup.rs \
            | sh -s -- --default-toolchain stable --profile minimal --no-modify-path -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustc" --version

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Test Rust application
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          export PIXHELF_SKIP_FRONTEND_BUILD=1
          cargo test --locked

  release:
    if: startsWith(forgejo.ref, 'refs/tags/v')
    needs: build
    runs-on: docker
    container:
      image: docker.io/library/node:22-bookworm
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    env:
      # The runner's Docker daemon uses the containerd image store, which does
      # not expose the MergedDir required by CROSS_CONTAINER_IN_CONTAINER.
      # Remote mode transfers the project and artifacts through Docker volumes.
      CROSS_REMOTE: "true"
      # Non-hidden paths are required so cross can expose the Rust toolchain in
      # the remote build container when the workflow itself runs as root.
      CARGO_HOME: /opt/cargo
      RUSTUP_HOME: /opt/rustup
    steps:
      - name: Check out source
        uses: https://data.forgejo.org/actions/checkout@v6

      - name: Install Rust, Docker CLI, and cross
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            binutils \
            build-essential \
            ca-certificates \
            curl \
            docker.io \
            file \
            pkg-config
          curl --proto '=https' --tlsv1.2 --silent --show-error --fail https://sh.rustup.rs \
            | sh -s -- --default-toolchain stable --profile minimal --no-modify-path -y
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          "$CARGO_HOME/bin/cargo" install \
            --git https://github.com/cross-rs/cross \
            --rev 8c1a8aa4b661711f4b7b6ac07c2e8929ce2f7d27 \
            --locked \
            cross
          docker version
          "$CARGO_HOME/bin/rustc" --version
          "$CARGO_HOME/bin/cross" --version

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build static musl release binaries
        run: |
          set -eu
          export PATH="$CARGO_HOME/bin:$PATH"
          export PIXHELF_SKIP_FRONTEND_BUILD=1
          mkdir -p dist

          build_release() {
            target="$1"
            asset="$2"
            machine="$3"
            binary="target/${target}/release/pixhelf"

            cross build --release --locked --target "$target"
            file "$binary"

            if ! readelf -h "$binary" | grep -q "Machine:.*${machine}"; then
              echo "Unexpected architecture for ${binary}"
              exit 1
            fi
            if readelf -l "$binary" | grep -q INTERP; then
              echo "${binary} unexpectedly requires a dynamic loader"
              exit 1
            fi
            if readelf -d "$binary" 2>/dev/null | grep -q NEEDED; then
              echo "${binary} unexpectedly requires a shared library"
              exit 1
            fi

            install -m 0755 "$binary" "dist/${asset}"
          }

          build_release \
            x86_64-unknown-linux-musl \
            pixhelf-amd64-linux \
            'Advanced Micro Devices X86-64'
          build_release \
            aarch64-unknown-linux-musl \
            pixhelf-arm64-linux \
            AArch64

          dist/pixhelf-amd64-linux --help >/dev/null

      - name: Prepare release metadata
        run: |
          tag="${FORGEJO_REF_NAME:-${GITHUB_REF_NAME}}"
          printf 'RELEASE_TAG=%s\n' "$tag" >> "$GITHUB_ENV"

      - name: Create Forgejo release and upload assets
        run: |
          set -eu
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:-}}"
          server="${FORGEJO_SERVER_URL:-${GITHUB_SERVER_URL}}"
          repository="${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY}}"
          api="${server}/api/v1"
          test -n "$token"

          release_json="$(mktemp)"
          release_status="$(curl --silent --show-error --output "$release_json" --write-out '%{http_code}' \
            --header "Authorization: token ${token}" \
            "${api}/repos/${repository}/releases/tags/${RELEASE_TAG}")"

          case "$release_status" in
            200)
              release_id="$(RELEASE_JSON="$release_json" node -e \
                'process.stdout.write(String(JSON.parse(require("fs").readFileSync(process.env.RELEASE_JSON)).id))')"
              ;;
            404)
              release_payload="$(RELEASE_TAG="$RELEASE_TAG" node <<'NODE'
          const tag = process.env.RELEASE_TAG;
          process.stdout.write(JSON.stringify({
            tag_name: tag,
            target_commitish: tag,
            name: tag,
            body: `Automated release ${tag}`,
            draft: false,
            prerelease: tag.includes('-'),
            hide_archive_links: true,
          }));
          NODE
              )"
              curl --silent --show-error --fail --output "$release_json" \
                --request POST \
                --header "Authorization: token ${token}" \
                --header 'Content-Type: application/json' \
                --data-binary "$release_payload" \
                "${api}/repos/${repository}/releases"
              release_id="$(RELEASE_JSON="$release_json" node -e \
                'process.stdout.write(String(JSON.parse(require("fs").readFileSync(process.env.RELEASE_JSON)).id))')"
              ;;
            *)
              cat "$release_json"
              exit 1
              ;;
          esac

          curl --silent --show-error --fail \
            --request PATCH \
            --header "Authorization: token ${token}" \
            --header 'Content-Type: application/json' \
            --data-binary '{"hide_archive_links":true}' \
            "${api}/repos/${repository}/releases/${release_id}" \
            >/dev/null

          assets_json="$(mktemp)"
          curl --silent --show-error --fail --output "$assets_json" \
            --header "Authorization: token ${token}" \
            "${api}/repos/${repository}/releases/${release_id}/assets"

          delete_asset() {
            asset_name="$1"
            asset_id="$(ASSETS_JSON="$assets_json" ASSET_NAME="$asset_name" node -e \
              'const assets = JSON.parse(require("fs").readFileSync(process.env.ASSETS_JSON)); const found = assets.find((asset) => asset.name === process.env.ASSET_NAME); process.stdout.write(found ? String(found.id) : "")')"
            if [ -z "$asset_id" ]; then
              return
            fi
            curl --silent --show-error --fail \
              --request DELETE \
              --header "Authorization: token ${token}" \
              "${api}/repos/${repository}/releases/${release_id}/assets/${asset_id}"
            echo "Deleted existing release asset: ${asset_name}"
          }

          delete_asset pixhelf-amd64
          delete_asset pixhelf-arm64
          delete_asset compose.yml

          for asset in dist/pixhelf-amd64-linux dist/pixhelf-arm64-linux; do
            asset_name="$(basename "$asset")"
            delete_asset "$asset_name"
            curl --silent --show-error --fail \
              --request POST \
              --header "Authorization: token ${token}" \
              --header 'Content-Type: application/octet-stream' \
              --data-binary "@${asset}" \
              "${api}/repos/${repository}/releases/${release_id}/assets?name=${asset_name}"
            printf '\n'
          done

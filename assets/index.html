<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0c0d0d">
  <title>暮色画廊</title>
  <link rel="stylesheet" href="/assets/app.css">
  <link rel="stylesheet" href="/assets/stage.css">
</head>
<body>
  <header>
    <a class="brand" href="/" aria-label="暮色画廊" title="暮色画廊"><svg viewBox="0 0 40 40" aria-hidden="true"><rect x="7.5" y="7.5" width="25" height="25" rx="2"/><circle cx="20" cy="20" r="6"/><path d="M20 3.5v4M20 32.5v4M3.5 20h4M32.5 20h4"/></svg></a>
    <div class="tools">
      <div class="folder-picker">
        <button id="folders" class="tool-button folder-button" title="选择文件夹" aria-label="选择文件夹" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6.5h6l2 2h9v9.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg></button>
        <div id="folder-menu" class="folder-menu" hidden>
          <div class="folder-heading">选择路径</div>
          <div id="folder-tree" class="folder-tree" role="tree"></div>
        </div>
      </div>
      <div class="search" id="search-box"><button id="search-toggle" class="tool-button search-toggle" aria-label="展开搜索" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg></button><input id="search" type="search" placeholder="搜索作品名…" autocomplete="off" aria-label="搜索作品名"></div>
      <button id="random" class="tool-button" title="随机顺序" aria-label="随机顺序" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h2.5c5.5 0 5.5 10 11 10H20M17 4l3 3-3 3M4 17h2.5c1.7 0 2.8-.9 3.8-2.2M13.7 9.2C14.7 8 15.8 7 17.5 7H20M17 14l3 3-3 3"/></svg></button>
      <button id="scan" class="tool-button" title="重新扫描图库" aria-label="重新扫描图库"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M19 12a7 7 0 1 0-2.05 4.95"/></svg></button>
    </div>
  </header>
  <main>
    <section id="gallery" class="gallery" aria-live="polite"></section>
    <div id="empty" class="empty" hidden><b>这里还没有图片</b><span>把图片放入 pictures 目录，然后点击右上角刷新。</span></div>
    <div id="sentinel" aria-hidden="true"></div>
  </main>
  <dialog id="lightbox">
    <button class="close" aria-label="关闭">×</button>
    <button class="nav prev" aria-label="上一张">‹</button>
    <figure><div class="stage"><img class="preview" alt=""><img class="original" alt=""></div><figcaption><b></b><span class="detail"></span><a class="download" aria-label="下载原图" title="下载原图" download><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 5-5m-5 5-5-5M5 20h14"/></svg></a></figcaption></figure>
    <button class="nav next" aria-label="下一张">›</button>
  </dialog>
  <script src="/assets/app.js" defer></script>
</body>
</html>

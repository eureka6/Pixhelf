<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#343a44">
  <title>Pixhelf</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>document.documentElement.dataset.theme=localStorage.getItem('gallery-theme')||'dark'</script>
  <link rel="stylesheet" href="/assets/app.css">
  <link rel="stylesheet" href="/assets/stage.css">
</head>
<body>
  <header>
    <a class="brand" href="/" aria-label="Pixhelf 首页" title="Pixhelf"><svg viewBox="0 0 40 40" aria-hidden="true"><rect x="7.5" y="7.5" width="25" height="25" rx="2"/><circle cx="20" cy="20" r="6"/><path d="M20 3.5v4M20 32.5v4M3.5 20h4M32.5 20h4"/></svg><span class="brand-copy"><b>Pixhelf</b><small>LOCAL GALLERY</small></span></a>
    <div class="tools">
      <div class="folder-picker">
        <button id="folders" class="tool-button folder-button" title="选择文件夹" aria-label="选择文件夹" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6.5h6l2 2h9v9.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg></button>
        <div id="folder-menu" class="folder-menu" hidden>
          <div class="folder-heading">选择路径</div>
          <div id="folder-tree" class="folder-tree" role="tree"></div>
        </div>
      </div>
      <div class="search" id="search-box"><button id="search-toggle" class="tool-button search-toggle" aria-label="展开搜索" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg></button><input id="search" type="search" placeholder="搜索作品名…" autocomplete="off" aria-label="搜索作品名"></div>
      <div class="more-picker">
        <button id="more" class="tool-button more-button" title="更多操作" aria-label="更多操作" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg></button>
        <div id="more-menu" class="more-menu" hidden>
          <div class="menu-heading">更多操作</div>
          <button id="random" class="menu-item" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h2.5c5.5 0 5.5 10 11 10H20M17 4l3 3-3 3M4 17h2.5c1.7 0 2.8-.9 3.8-2.2M13.7 9.2C14.7 8 15.8 7 17.5 7H20M17 14l3 3-3 3"/></svg><span>探索列队</span></button>
          <button id="scan" class="menu-item"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M19 12a7 7 0 1 0-2.05 4.95"/></svg><span>重新扫描</span></button>
          <div class="menu-divider"></div>
          <button id="theme" class="menu-item"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="theme-sun" d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/><circle cx="12" cy="12" r="4"/></svg><span class="theme-label">切换浅色主题</span><span class="menu-value">暗色</span></button>
        </div>
      </div>
    </div>
  </header>
  <main>
    <section id="gallery" class="gallery" aria-live="polite"></section>
    <div id="empty" class="empty" hidden><b>这里还没有图片</b><span>把图片放入 pictures 目录，然后点击右上角刷新。</span></div>
    <div id="sentinel" aria-hidden="true"></div>
  </main>
  <dialog id="lightbox" aria-label="图片查看器，点击左半屏或右半屏切换图片">
    <div class="viewer-count" aria-live="polite"></div>
    <button class="close" aria-label="关闭"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5 17.5 17.5M17.5 6.5 6.5 17.5"/></svg></button>
    <figure><div class="stage"><img class="preview" alt="" decoding="async"><img class="original" alt="" decoding="async"><div class="viewer-load-failure" role="status" hidden><span class="load-failure-mark" aria-hidden="true"></span><b>资源无法载入</b><small>原文件可能暂时不可用</small></div></div><div class="details-panel" hidden><div class="details-heading">图片详情</div><dl><div><dt>文件名</dt><dd><button type="button" class="detail-copy" aria-label="复制文件名" aria-live="polite" title="点击复制文件名"><span data-detail="name"></span><svg class="copy-icon" viewBox="0 0 20 20" aria-hidden="true"><rect x="7" y="7" width="9" height="9" rx="2"/><path d="M13 7V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h1"/></svg><svg class="check-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="m4.5 10.5 3.3 3.3 7.7-7.7"/></svg></button></dd></div><div><dt>所在路径</dt><dd data-detail="path"></dd></div><div><dt>尺寸</dt><dd data-detail="dimensions"></dd></div><div><dt>格式</dt><dd data-detail="format"></dd></div><div><dt>文件大小</dt><dd data-detail="size"></dd></div></dl></div><div class="viewer-actions"><div class="viewer-action-menu" hidden><button class="info" aria-label="显示图片详情" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 10.5v6M12 7.5h.01"/></svg><span>图片详情</span></button><button id="recommendations" class="recommendations" aria-label="更多推荐，待完善" hidden disabled><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="7" width="12" height="11" rx="1.5"/><path d="m7 15 2.5-2.5 2 2 1.5-1.5 3 3M18.5 4v4M16.5 6h4"/></svg><span>更多推荐</span><small>待完善</small></button><div class="viewer-menu-divider"></div><a class="download" aria-label="下载原图" download><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 5-5m-5 5-5-5M5 20h14"/></svg><span>下载原图</span></a></div><button class="viewer-more" aria-label="更多操作" title="更多操作" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="9.5" r="1.5"/><path d="m5.5 17 4.2-4.2 2.8 2.7 2.3-2.2 3.7 3.7"/></svg></button></div></figure>
  </dialog>
  <script src="/assets/app.js" defer></script>
</body>
</html>

services:
  gallery:
    image: eureka6688/gallery:latest
    container_name: gallery
    restart: unless-stopped
    ports:
      - "${GALLERY_PORT:-3002}:3002"
    volumes:
      - "${GALLERY_PICTURES:-./pictures}:/pictures:ro"
      - gallery-data:/data

volumes:
  gallery-data:
    name: gallery-data

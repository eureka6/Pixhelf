services:
  pixhelf:
    image: ${PIXHELF_IMAGE:-git.pixhelf.com/adminroot/pixhelf:latest}
    pull_policy: always
    restart: unless-stopped
    init: true
    ports:
      - "${PIXHELF_PORT:-3002}:3002"
    volumes:
      - "${PIXHELF_GALLERY:-./pic}:/gallery:ro"
      - pixhelf-cache:/cache
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3002/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pixhelf-cache:

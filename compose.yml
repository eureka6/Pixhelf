services:
  pixhelf:
    image: eureka6688/pixhelf:latest
    restart: unless-stopped
    environment:
      PIXHELF_INITIAL_BATCH: "60"
      PIXHELF_WORKERS: "4"
      PIXHELF_SCAN_INTERVAL: "10"
    ports:
      - "3002:3002"
    volumes:
      - "./pic:/data/pic:ro"
      - pixhelf-cache:/data/.pixhelf-cache

volumes:
  pixhelf-cache:

name: Build Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source version
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail

          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(
            cargo metadata --locked --no-deps --format-version 1 |
              jq -r '.packages[] | select(.name == "pixhelf") | .version'
          )"

          if [[ "$GITHUB_REF_NAME" != v* || -z "$tag_version" ]]; then
            echo "Release tags must start with v, for example v0.1.0." >&2
            exit 1
          fi

          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $package_version." >&2
            exit 1
          fi

  docker:
    name: Build native images and merge manifest
    needs: validate
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      context: .
      file: ./Dockerfile
      target: runtime
      cache: true
      cache-scope: pixhelf
      meta-images: eureka6688/pixhelf
      meta-tags: |
        type=raw,value=latest
        type=semver,pattern={{version}}
      set-meta-labels: true
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

name: Release MUSL binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-24.04

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate tag and package version
        shell: bash
        run: |
          set -euo pipefail

          tag_version="${RELEASE_TAG#v}"
          package_version="$(
            cargo metadata --locked --no-deps --format-version 1 |
              jq -r '.packages[] | select(.name == "pixhelf") | .version'
          )"

          if [[ "$RELEASE_TAG" != v* || -z "$tag_version" ]]; then
            echo "Release tags must start with v, for example v0.1.0." >&2
            exit 1
          fi

          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag $RELEASE_TAG does not match Cargo.toml version $package_version." >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.architecture }} MUSL binary
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - architecture: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    env:
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install MUSL toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add "${{ matrix.target }}"

      - name: Build static binary
        shell: bash
        run: |
          set -euo pipefail

          binary="target/${{ matrix.target }}/release/pixhelf"
          output="release/pixhelf-${{ matrix.target }}"

          cargo build --locked --release --target "${{ matrix.target }}"

          if readelf -l "$binary" | grep -q 'INTERP'; then
            echo "$binary contains a dynamic program interpreter." >&2
            exit 1
          fi

          if readelf -d "$binary" 2>/dev/null | grep -q 'NEEDED'; then
            echo "$binary contains dynamic library dependencies." >&2
            exit 1
          fi

          mkdir -p release
          install -m 0755 "$binary" "$output"
          file "$output"

      - name: Upload binary for release job
        uses: actions/upload-artifact@v7
        with:
          name: pixhelf-${{ matrix.target }}
          path: release/pixhelf-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download built binaries
        uses: actions/download-artifact@v8
        with:
          pattern: pixhelf-*-unknown-linux-musl
          path: release
          merge-multiple: true

      - name: Generate and verify checksums
        shell: bash
        run: |
          set -euo pipefail

          chmod 0755 release/pixhelf-*-unknown-linux-musl
          (
            cd release
            sha256sum ./pixhelf-*-unknown-linux-musl > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
            for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
              gh release delete-asset "$RELEASE_TAG" \
                "pixhelf-${RELEASE_TAG}-${target}" --yes 2>/dev/null || true
            done
          else
            gh release create "$RELEASE_TAG" release/* \
              --verify-tag \
              --generate-notes \
              --title "Pixhelf $RELEASE_TAG"
          fi

[package]
name = "pixhelf"
version = "0.2.0"
edition = "2024"
build = "build.rs"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["json", "query", "tokio"] }
blake3 = "1.8.7"
candle-core = { version = "0.9.2", default-features = false }
candle-nn = { version = "0.9.2", default-features = false }
candle-transformers = { version = "0.9.2", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
natord = "1.0.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.53.1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.11", features = ["compression-br", "compression-gzip", "fs", "set-header", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }
walkdir = "2.5.0"
webp = "0.3.1"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = "symbols"
